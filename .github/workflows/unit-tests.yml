name: Unit tests
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ✅
        uses: actions/checkout@v6

      - name: Setup Node.js 🔧
        uses: actions/setup-node@v6
        with:
          node-version: "lts/*"

      - name: Setup pnpm 🛠️
        uses: pnpm/action-setup@v4

      - name: Install dependencies 🛠️
        run: pnpm i

      - name: Run Vitest with scss-true 🧪
        run: pnpm run test
